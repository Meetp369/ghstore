name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test (race detector)
        run: go test -race -count=1 ./...
      - name: kill -9 recovery (20 runs)
        run: GHSTORE_CRASH_ITERS=20 go test -race -count=1 -run TestKill9Recovery ./internal/store
